[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nio-ma-demo"
version = "0.1.0"
description = "蔚来 MA 迁移 Demo：飞书 Bot 通过火山方舟 Managed Agents 演示身份透传/岗位注入/跨 Session 记忆/静态 Bearer 鉴权"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "qrcode>=7.4",
    "lark-oapi>=1.7",
    "mcp>=1.2,<2",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
arkagent = "arkagent.cli:main"
nio-mock-mcp = "mock_mcp.__main__:main"

[tool.setuptools]
packages = ["arkagent", "mock_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
